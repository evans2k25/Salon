<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Salon – Prise de rendez-vous</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14213d;--mute:#5d6678;--line:#dde0e6;--red:#d62839;--blue:#2f5f9e;--on:#fff;--sel:#e8eef7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18233a;--ink:#eef1f7;--mute:#9aa5ba;--line:#2a3857;--red:#ef4b5b;--blue:#6fa0e0;--on:#0f1626;--sel:#22314f}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18233a;--ink:#eef1f7;--mute:#9aa5ba;--line:#2a3857;--red:#ef4b5b;--blue:#6fa0e0;--on:#0f1626;--sel:#22314f}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.pole{height:10px;background:repeating-linear-gradient(115deg,var(--red) 0 14px,#fff 14px 28px,var(--blue) 28px 42px,#fff 42px 56px)}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2rem;font-weight:800;margin:8px 0 2px;letter-spacing:-.02em}
h2{font-size:1.15rem;margin:22px 0 10px}
.sub{color:var(--mute);margin:0 0 16px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0 6px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:10px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;cursor:pointer}
.opt.sel{border-color:var(--blue);background:var(--sel)}
.opt small{color:var(--mute);display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{font:inherit;font-weight:600;background:var(--red);color:#fff;border:0;border-radius:12px;padding:14px 18px;width:100%;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--blue);font:inherit;cursor:pointer;padding:6px 0}
.danger{color:var(--red)}
input,select{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px;width:100%;margin-bottom:10px}
label{font-size:.9rem;color:var(--mute);display:block;margin-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-weight:600;min-width:52px}
.empty{color:var(--mute);padding:6px 0}
.ok{border-color:var(--blue);background:var(--sel)}
.steps{color:var(--mute);font-size:.9rem;margin-bottom:8px}
.grid,.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{margin-bottom:10px}
.stat{margin:0}.stat b{display:block;font-size:1.6rem;font-weight:800}.stat span{color:var(--mute);font-size:.9rem}
.bar{display:grid;grid-template-columns:96px 1fr 28px;gap:8px;align-items:center;padding:5px 0;font-size:.92rem}
.track{background:var(--sel);border-radius:6px;height:10px;overflow:hidden}.track i{display:block;height:100%;background:var(--blue);border-radius:6px}
.bar b{text-align:right}
.toast{display:none;position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:5}
.days{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.days .chip{padding:6px 11px;font-size:.9rem}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<div class="pole"></div>
<main>
  <h1>Salon Prestige</h1>
  <p class="sub">Réservez votre coupe en moins d’une minute.</p>
  <div class="tabs" role="tablist">
    <button id="tClient" class="on" onclick="setMode('client')">Je réserve</button>
    <button id="tSalon" onclick="setMode('salon')">Agenda</button>
    <button id="tGest" onclick="setMode('gestion')">Gestion</button>
  </div>
  <div id="app"></div>
</main>
<script>
var CUR = "€";
var OPEN = 9*60, CLOSE = 18*60, STEP = 30;
var SERVICES = [
  {id:"coupe", name:"Coupe", dur:30, price:15},
  {id:"barbe", name:"Barbe", dur:30, price:10},
  {id:"coupebarbe", name:"Coupe + barbe", dur:60, price:23},
  {id:"couleur", name:"Couleur", dur:90, price:45},
  {id:"brushing", name:"Brushing", dur:30, price:18}
];
var STYLISTS = [{id:"karim", name:"Karim"},{id:"aicha", name:"Aïcha"}];
var DAYS = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
var MONTHS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

var bookings = [];
try { bookings = JSON.parse(localStorage.getItem("rdv") || "[]"); } catch(e) { bookings = []; }
function save(){ try { localStorage.setItem("rdv", JSON.stringify(bookings)); } catch(e) {} }

var CLOSED = [], NOTICE = 2, CANCEL = 12;
try { var cfg = JSON.parse(localStorage.getItem("rdvcfg") || "null"); if (cfg) { SERVICES=cfg.services; STYLISTS=cfg.stylists; OPEN=cfg.open; CLOSE=cfg.close; CLOSED=cfg.closed||[]; NOTICE=cfg.notice; CANCEL=cfg.cancel; } } catch(e) {}
function saveCfg(){ try { localStorage.setItem("rdvcfg", JSON.stringify({services:SERVICES,stylists:STYLISTS,open:OPEN,close:CLOSE,closed:CLOSED,notice:NOTICE,cancel:CANCEL})); } catch(e) {} }
function works(date, s){ if (CLOSED.indexOf(date) > -1) return false; var p = date.split("-"); var dow = new Date(+p[0],+p[1]-1,+p[2]).getDay(); return (s.days || [1,2,3,4,5,6]).indexOf(dow) > -1; }
window.alert = function(t){ var e = document.getElementById("toast"); if (!e) { e = document.createElement("div"); e.id = "toast"; e.className = "toast"; e.setAttribute("role","status"); document.body.appendChild(e); } e.textContent = t; e.style.display = "block"; clearTimeout(e._t); e._t = setTimeout(function(){ e.style.display = "none"; }, 3500); };

function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hm(m){ return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function nowMin(){ var n = new Date(); return n.getHours()*60+n.getMinutes(); }
function openDays(){
  var out = [], d = new Date();
  if (nowMin() > CLOSE-STEP) d.setDate(d.getDate()+1);
  while (out.length < 7) { if (d.getDay() !== 0 && CLOSED.indexOf(iso(d)) < 0) out.push(new Date(d)); d.setDate(d.getDate()+1); }
  return out;
}
function dayLabel(d){ return DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]; }
function sname(id){ var s = STYLISTS.filter(function(x){return x.id===id;})[0]; return s ? s.name : "Ancien coiffeur"; }

function isFree(date, sty, start, dur){
  if (start+dur > CLOSE || start < OPEN) return false;
  var sObj = STYLISTS.filter(function(s){return s.id===sty;})[0];
  if (!sObj || !works(date, sObj)) return false;
  if (date === iso(new Date()) && start <= nowMin() + NOTICE*60) return false;
  return !bookings.some(function(b){ return b.date===date && b.stylist===sty && start < b.start+b.dur && b.start < start+dur; });
}
function slots(date, sty, dur){
  var out = [];
  for (var t = OPEN; t+dur <= CLOSE; t += STEP) {
    var list = sty==="any" ? STYLISTS.map(function(s){return s.id;}) : [sty];
    for (var i=0;i<list.length;i++) { if (isFree(date, list[i], t, dur)) { out.push({start:t, stylist:list[i]}); break; } }
  }
  return out;
}

// seed demo
if (!bookings.length) {
  var tm = openDays()[0] ? iso(openDays()[0]) : iso(new Date());
  bookings = [
    {id:1, date:tm, stylist:"karim", start:600, dur:30, service:"Coupe", name:"Moussa", phone:"07 00 00 00 01"},
    {id:2, date:tm, stylist:"aicha", start:660, dur:90, service:"Couleur", name:"Fanta", phone:"07 00 00 00 02"},
    {id:3, date:tm, stylist:"karim", start:840, dur:60, service:"Coupe + barbe", name:"Yann", phone:"07 00 00 00 03"}
  ];
}

var mode = "client";
var S = {step:1, svc:[], sty:"any", date:null, slot:null, name:"", phone:"", done:null};
var salonDay = iso(openDays()[0]);

function setMode(m){
  mode = m;
  document.getElementById("tClient").className = m==="client" ? "on" : "";
  document.getElementById("tSalon").className = m==="salon" ? "on" : "";
  document.getElementById("tGest").className = m==="gestion" ? "on" : "";
  render();
}
function totals(){
  var dur=0, price=0; S.svc.forEach(function(id){ var s=SERVICES.filter(function(x){return x.id===id;})[0]; dur+=s.dur; price+=s.price; });
  return {dur:dur, price:price};
}
function toggleSvc(id){ var i=S.svc.indexOf(id); if(i>-1) S.svc.splice(i,1); else S.svc.push(id); S.date=null; S.slot=null; render(); }
function go(n){ S.step=n; render(); }

function renderClient(){
  var h = "";
  if (S.done) {
    var b = S.done;
    return '<div class="card ok"><h2 style="margin-top:0">Rendez-vous confirmé</h2><p><b>'+b.service+'</b> avec '+sname(b.stylist)+'<br>'+dayLabelFromIso(b.date)+' à '+hm(b.start)+'</p><p class="sub">Un rappel sera envoyé par SMS ou WhatsApp au '+b.phone+' la veille et 2 h avant.</p></div><button class="btn" onclick="resetClient()">Prendre un autre rendez-vous</button><button class="link" onclick="cancelMine('+b.id+')">Annuler ce rendez-vous</button>';
  }
  h += '<div class="steps">Étape '+S.step+' sur 4</div>';
  if (S.step===1) {
    h += '<h2 style="margin-top:0">Quelle prestation ?</h2>';
    SERVICES.filter(function(s){return s.active!==false;}).forEach(function(s){
      h += '<button class="opt'+(S.svc.indexOf(s.id)>-1?' sel':'')+'" onclick="toggleSvc(\''+s.id+'\')"><span>'+s.name+'<small>'+s.dur+' min</small></span><b>'+s.price+' '+CUR+'</b></button>';
    });
    var t = totals();
    h += '<button class="btn" '+(S.svc.length?'':'disabled')+' onclick="go(2)">Continuer'+(S.svc.length?' · '+t.dur+' min · '+t.price+' '+CUR:'')+'</button>';
  } else if (S.step===2) {
    h += '<h2 style="margin-top:0">Avec qui ?</h2>';
    [{id:"any",name:"Peu importe"}].concat(STYLISTS).forEach(function(s){
      h += '<button class="opt'+(S.sty===s.id?' sel':'')+'" onclick="S.sty=\''+s.id+'\';S.date=null;S.slot=null;render()"><span>'+s.name+'</span></button>';
    });
    h += '<button class="btn" onclick="go(3)">Continuer</button><button class="link" onclick="go(1)">Retour</button>';
  } else if (S.step===3) {
    var dur = totals().dur;
    h += '<h2 style="margin-top:0">Quel jour ?</h2><div class="chips">';
    openDays().forEach(function(d){ var k=iso(d); h += '<button class="chip'+(S.date===k?' sel':'')+'" onclick="S.date=\''+k+'\';S.slot=null;render()">'+dayLabel(d)+'</button>'; });
    h += '</div>';
    if (S.date) {
      var list = slots(S.date, S.sty, dur);
      h += '<h2>Quelle heure ?</h2>';
      if (!list.length) h += '<p class="empty">Aucun créneau libre ce jour-là. Essayez un autre jour.</p>';
      h += '<div class="chips">';
      list.forEach(function(s,i){ h += '<button class="chip'+(S.slot&&S.slot.start===s.start?' sel':'')+'" onclick="pickSlot('+i+')">'+hm(s.start)+'</button>'; });
      h += '</div>';
    }
    h += '<button class="btn" '+(S.slot?'':'disabled')+' onclick="go(4)">Continuer</button><button class="link" onclick="go(2)">Retour</button>';
  } else {
    h += '<h2 style="margin-top:0">Vos coordonnées</h2><div class="card">'+recap()+'</div>';
    h += '<label for="nm">Nom</label><input id="nm" value="'+S.name+'" oninput="S.name=this.value;chk()" autocomplete="name">';
    h += '<label for="ph">Téléphone</label><input id="ph" type="tel" value="'+S.phone+'" oninput="S.phone=this.value;chk()" autocomplete="tel">';
    h += '<button class="btn" id="conf" disabled onclick="confirmBooking()">Confirmer le rendez-vous</button><button class="link" onclick="go(3)">Retour</button>';
  }
  return h;
}
function recap(){
  var names = S.svc.map(function(id){return SERVICES.filter(function(x){return x.id===id;})[0].name;}).join(" + ");
  var t = totals();
  return '<b>'+names+'</b> · '+t.dur+' min · '+t.price+' '+CUR+'<br>'+sname(S.slot.stylist)+' · '+dayLabelFromIso(S.date)+' à '+hm(S.slot.start);
}
function dayLabelFromIso(k){ var p=k.split("-"); return dayLabel(new Date(+p[0],+p[1]-1,+p[2])); }
function pickSlot(i){ S.slot = slots(S.date, S.sty, totals().dur)[i]; render(); }
function chk(){ var ok = S.name.trim().length>1 && S.phone.replace(/\D/g,"").length>=8; document.getElementById("conf").disabled = !ok; }
function confirmBooking(){
  var t = totals();
  if (!isFree(S.date, S.slot.stylist, S.slot.start, t.dur)) { alert("Ce créneau vient d’être pris. Choisissez-en un autre."); S.slot=null; S.step=3; render(); return; }
  var names = S.svc.map(function(id){return SERVICES.filter(function(x){return x.id===id;})[0].name;}).join(" + ");
  var b = {id:Date.now(), date:S.date, stylist:S.slot.stylist, start:S.slot.start, dur:t.dur, service:names, name:S.name.trim(), phone:S.phone.trim()};
  bookings.push(b); save(); S.done = b; render();
}
function cancelMine(id){
  var b = bookings.filter(function(x){return x.id===id;})[0];
  if (b) { var p = b.date.split("-"); var when = new Date(+p[0],+p[1]-1,+p[2],0,b.start); if (when - new Date() < CANCEL*3600000) { alert("L’annulation en ligne n’est plus possible à moins de "+CANCEL+" h du rendez-vous. Appelez le salon."); return; } }
  cancelBooking(id); resetClient();
}
function resetClient(){ S = {step:1, svc:[], sty:"any", date:null, slot:null, name:"", phone:"", done:null}; render(); }
function cancelBooking(id){ bookings = bookings.filter(function(b){return b.id!==id;}); save(); render(); }

function renderSalon(){
  var h = '<h2 style="margin-top:0">Agenda</h2><div class="chips">';
  openDays().forEach(function(d){ var k=iso(d); h += '<button class="chip'+(salonDay===k?' sel':'')+'" onclick="salonDay=\''+k+'\';render()">'+dayLabel(d)+'</button>'; });
  h += '</div>';
  STYLISTS.forEach(function(s){
    var list = bookings.filter(function(b){return b.date===salonDay && b.stylist===s.id;}).sort(function(a,b){return a.start-b.start;});
    h += '<h2>'+s.name+'</h2><div class="card">';
    if (!list.length) h += '<p class="empty">Aucun rendez-vous. Journée libre.</p>';
    list.forEach(function(b){
      h += '<div class="row"><span class="t">'+hm(b.start)+'</span><span style="flex:1">'+(b.blocked?'<b>Créneau bloqué</b>':'<b>'+esc(b.name)+'</b> · '+esc(b.service))+'<small style="display:block;color:var(--mute)">'+b.dur+' min'+(b.blocked?'':' · '+esc(b.phone))+'</small></span><button class="link danger" onclick="cancelBooking('+b.id+')">'+(b.blocked?'Débloquer':'Annuler')+'</button></div>';
    });
    h += '</div>';
  });
  h += '<h2>Bloquer un créneau</h2><div class="card"><label for="bs">Coiffeur</label><select id="bs">'+STYLISTS.map(function(s){return '<option value="'+s.id+'">'+s.name+'</option>';}).join("")+'</select><label for="bt">Heure de début</label><select id="bt">';
  for (var t=OPEN;t<CLOSE;t+=STEP) h += '<option value="'+t+'">'+hm(t)+'</option>';
  h += '</select><label for="bd">Durée</label><select id="bd"><option value="30">30 min</option><option value="60">1 h</option><option value="120">2 h</option><option value="480">Journée entière</option></select><button class="btn" onclick="block()">Bloquer ce créneau</button></div>';
  return h;
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
/* ===== Espace gérant ===== */
var unlocked = false;
function unlock(){ if (document.getElementById("pin").value === "1234") { unlocked = true; render(); } else { alert("Code incorrect."); } }
function priceOf(b){ if (b.blocked) return 0; return String(b.service).split(" + ").reduce(function(a,n){ var s = SERVICES.filter(function(x){return x.name===n;})[0]; return a + (s ? s.price : 0); }, 0); }
function stat(v,l){ return '<div class="card stat"><b>'+v+'</b><span>'+l+'</span></div>'; }
function bar(l,n,mx){ return '<div class="bar"><span>'+l+'</span><div class="track"><i style="width:'+Math.round(100*n/mx)+'%"></i></div><b>'+n+'</b></div>'; }
function opts(list,sel,fmt){ return list.map(function(v){ return '<option value="'+v+'"'+(v===sel?' selected':'')+'>'+fmt(v)+'</option>'; }).join(""); }
function hh(v){ return v+" h"; }
function persist(){ saveCfg(); render(); }
function setHours(){ var o = +document.getElementById("go").value*60, c = +document.getElementById("gc").value*60; if (c <= o) { alert("La fermeture doit être après l’ouverture."); render(); return; } OPEN = o; CLOSE = c; persist(); }
function setNotice(v){ NOTICE = +v; persist(); }
function setCancel(v){ CANCEL = +v; persist(); }
function setSvc(i,k,v){ if (k==="name") { v = v.trim(); if (!v) { render(); return; } } else { v = Math.max(k==="dur" ? 15 : 0, +v || 0); } SERVICES[i][k] = v; persist(); }
function toggleActive(i){ var vis = SERVICES.filter(function(s){return s.active!==false;}).length; if (SERVICES[i].active!==false && vis<2) { alert("Gardez au moins une prestation visible."); return; } SERVICES[i].active = (SERVICES[i].active===false); persist(); }
function delSvc(i){ if (SERVICES.length<2) { alert("Gardez au moins une prestation."); return; } SERVICES.splice(i,1); persist(); }
function addSvc(){ var n = document.getElementById("ns").value.trim(), d = +document.getElementById("nd").value, p = +document.getElementById("np").value || 0; if (!n) { alert("Donnez un nom à la prestation."); return; } SERVICES.push({id:"s"+Date.now(), name:n, dur:d, price:p}); persist(); }
function renameSty(i,v){ v = v.trim(); if (v) STYLISTS[i].name = v; persist(); }
function toggleDay(i,d){ var a = STYLISTS[i].days || [1,2,3,4,5,6]; var k = a.indexOf(d); if (k>-1) a.splice(k,1); else a.push(d); STYLISTS[i].days = a; persist(); }
function delSty(i){ var s = STYLISTS[i]; if (STYLISTS.length<2) { alert("Gardez au moins un coiffeur."); return; } var has = bookings.some(function(b){return b.stylist===s.id && b.date>=iso(new Date());}); if (has) { alert(s.name+" a des rendez-vous à venir. Annulez-les d’abord."); return; } STYLISTS.splice(i,1); persist(); }
function addSty(){ var n = document.getElementById("nsty").value.trim(); if (!n) { alert("Saisissez un prénom."); return; } STYLISTS.push({id:"c"+Date.now(), name:n, days:[1,2,3,4,5,6]}); persist(); }
function addClosed(){ var v = document.getElementById("cd").value; if (!v) { alert("Choisissez une date."); return; } if (CLOSED.indexOf(v)<0) CLOSED.push(v); CLOSED.sort(); var n = bookings.filter(function(b){return b.date===v && !b.blocked;}).length; persist(); if (n) alert(n+" rendez-vous existent déjà ce jour-là : prévenez les clients."); }
function delClosed(i){ CLOSED.splice(i,1); persist(); }

function renderGestion(){
  if (!unlocked) return '<div class="card"><h2 style="margin-top:0">Espace gérant</h2><p class="sub">Entrez le code d’accès (code de démonstration : 1234).</p><label for="pin">Code</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"><button class="btn" onclick="unlock()">Entrer</button></div>';
  var real = bookings.filter(function(b){return !b.blocked;});
  var days = openDays().map(iso), todayK = iso(new Date());
  var upcoming = real.filter(function(b){return b.date>=todayK;});
  var cap = 0, used = 0;
  days.forEach(function(k){ STYLISTS.forEach(function(s){ if (works(k,s)) cap += CLOSE-OPEN; }); });
  real.forEach(function(b){ if (days.indexOf(b.date)>-1) used += b.dur; });
  var occ = cap ? Math.round(100*used/cap) : 0;
  var rev = upcoming.reduce(function(a,b){return a+priceOf(b);}, 0);
  var h = '<h2 style="margin-top:0">Tableau de bord</h2><div class="grid">'
    + stat(real.filter(function(b){return b.date===todayK;}).length, "rendez-vous aujourd’hui")
    + stat(upcoming.length, "rendez-vous à venir")
    + stat(rev+" "+CUR, "chiffre d’affaires prévu")
    + stat(occ+" %", "occupation sur 7 jours") + '</div>';
  var counts = days.map(function(k){return real.filter(function(b){return b.date===k;}).length;});
  var mx = Math.max.apply(null, counts.concat([1]));
  h += '<h2>Rendez-vous par jour</h2><div class="card">';
  days.forEach(function(k,i){ h += bar(dayLabelFromIso(k), counts[i], mx); });
  h += '</div>';
  var cnt = {}; real.forEach(function(b){ String(b.service).split(" + ").forEach(function(n){ cnt[n] = (cnt[n]||0)+1; }); });
  var names = Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];});
  h += '<h2>Prestations les plus demandées</h2><div class="card">';
  if (!names.length) h += '<p class="empty">Pas encore de réservation.</p>';
  names.forEach(function(n){ h += bar(esc(n), cnt[n], cnt[names[0]]); });
  h += '</div>';

  h += '<h2>Horaires et règles</h2><div class="card"><div class="two"><div><label for="go">Ouverture</label><select id="go" onchange="setHours()">'+opts([6,7,8,9,10,11],OPEN/60,hh)+'</select></div><div><label for="gc">Fermeture</label><select id="gc" onchange="setHours()">'+opts([16,17,18,19,20,21,22],CLOSE/60,hh)+'</select></div></div>'
    + '<label for="gn">Délai minimum avant un rendez-vous</label><select id="gn" onchange="setNotice(this.value)">'+opts([0,1,2,4,12,24],NOTICE,function(v){return v?v+" h":"Aucun";})+'</select>'
    + '<label for="gx">Annulation en ligne possible jusqu’à</label><select id="gx" onchange="setCancel(this.value)">'+opts([0,2,6,12,24,48],CANCEL,function(v){return v?v+" h avant":"Le dernier moment";})+'</select></div>';

  h += '<h2>Prestations</h2>';
  SERVICES.forEach(function(s,i){
    h += '<div class="card"'+(s.active===false?' style="opacity:.6"':'')+'><label for="sn'+i+'">Nom</label><input id="sn'+i+'" value="'+esc(s.name)+'" onchange="setSvc('+i+',\'name\',this.value)"><div class="two"><div><label for="sd'+i+'">Durée (min)</label><input id="sd'+i+'" type="number" min="15" step="15" value="'+s.dur+'" onchange="setSvc('+i+',\'dur\',this.value)"></div><div><label for="sp'+i+'">Prix ('+CUR+')</label><input id="sp'+i+'" type="number" min="0" value="'+s.price+'" onchange="setSvc('+i+',\'price\',this.value)"></div></div><button class="link" onclick="toggleActive('+i+')">'+(s.active===false?'Afficher aux clients':'Masquer aux clients')+'</button> <button class="link danger" onclick="delSvc('+i+')">Supprimer</button></div>';
  });
  h += '<div class="card"><b>Ajouter une prestation</b><label for="ns">Nom</label><input id="ns" placeholder="Ex. Soin du cuir chevelu"><div class="two"><div><label for="nd">Durée</label><select id="nd">'+opts([30,45,60,90,120],30,function(v){return v+" min";})+'</select></div><div><label for="np">Prix ('+CUR+')</label><input id="np" type="number" min="0" value="15"></div></div><button class="btn" onclick="addSvc()">Ajouter la prestation</button></div>';

  h += '<h2>Équipe</h2>';
  STYLISTS.forEach(function(s,i){
    var dd = s.days || [1,2,3,4,5,6];
    h += '<div class="card"><label for="cn'+i+'">Prénom</label><input id="cn'+i+'" value="'+esc(s.name)+'" onchange="renameSty('+i+',this.value)"><label>Jours de travail</label><div class="days">'+[1,2,3,4,5,6,0].map(function(d){ return '<button class="chip'+(dd.indexOf(d)>-1?' sel':'')+'" onclick="toggleDay('+i+','+d+')">'+DAYS[d]+'</button>'; }).join("")+'</div><button class="link danger" onclick="delSty('+i+')">Retirer de l’équipe</button></div>';
  });
  h += '<div class="card"><b>Ajouter un coiffeur</b><label for="nsty">Prénom</label><input id="nsty"><button class="btn" onclick="addSty()">Ajouter à l’équipe</button></div>';

  h += '<h2>Fermetures et congés</h2><div class="card">';
  if (!CLOSED.length) h += '<p class="empty">Aucune fermeture prévue.</p>';
  CLOSED.forEach(function(k,i){ h += '<div class="row"><span style="flex:1"><b>'+dayLabelFromIso(k)+'</b></span><button class="link" onclick="delClosed('+i+')">Rouvrir</button></div>'; });
  h += '<label for="cd" style="margin-top:10px">Fermer le salon le</label><input id="cd" type="date"><button class="btn" onclick="addClosed()">Ajouter cette fermeture</button></div>';
  h += '<button class="link" onclick="unlocked=false;render()">Verrouiller l’espace gérant</button>';
  return h;
}

function block(){
  var sty=document.getElementById("bs").value, st=+document.getElementById("bt").value, du=+document.getElementById("bd").value;
  if (du===480) { st=OPEN; du=CLOSE-OPEN; }
  if (!isFree(salonDay, sty, st, du) && !(du===CLOSE-OPEN)) { alert("Ce créneau chevauche un rendez-vous existant."); return; }
  bookings.push({id:Date.now(), date:salonDay, stylist:sty, start:st, dur:Math.min(du,CLOSE-st), service:"", name:"", phone:"", blocked:true}); save(); render();
}
function render(){
  document.getElementById("app").innerHTML = mode==="client" ? renderClient() : mode==="salon" ? renderSalon() : renderGestion();
  if (mode==="client" && S.step===4 && !S.done) chk();
}
render();
if ("serviceWorker" in navigator) { window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
</body>
</html>
